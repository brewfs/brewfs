[package]
name = "brewfs-operator"
version = "0.1.0"
edition = "2021"
authors = ["rk8s-dev team"]
description = "Independent Kubernetes operator for BrewFS"
license = "MIT"

[workspace]

[features]
default = []
workspace-operator = ["dep:async-trait", "dep:brewfs", "dep:hex", "dep:uuid", "dep:tempfile", "dep:sha2", "dep:tokio-util"]

[dependencies]
anyhow = "1.0"
async-trait = { version = "0.1", optional = true }
brewfs = { path = "../..", default-features = false, features = ["workspace-overlay", "fuse-tokio-runtime"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
hex = { version = "0.4", optional = true }
k8s-openapi = { version = "0.23", features = ["v1_30"] }
kube = { version = "0.96", features = ["client", "derive", "runtime", "rustls-tls"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rustls = "0.23"
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
thiserror = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5"], optional = true }

[dev-dependencies]
tokio = { version = "1.48", features = ["test-util", "sync"] }
