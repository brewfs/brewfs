apiVersion: v1
kind: ServiceAccount
metadata:
  name: brewfs-csi-node
  namespace: brewfs-csi-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: brewfs-csi-node
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: brewfs-csi-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: brewfs-csi-node
subjects:
  - kind: ServiceAccount
    name: brewfs-csi-node
    namespace: brewfs-csi-system
