# Apply after manifests/ has been installed. Replace the PV volumeHandle with
# an existing operator-provisioned workspace. Run only one example per workspace.
# The PV capacity is administrator-supplied binding metadata, not a CSI quota.
apiVersion: v1
kind: Namespace
metadata:
  name: brewfs-csi-smoke
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: brewfs-csi-smoke-workspace
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: workspace
    namespace: brewfs-csi-smoke
  csi:
    driver: csi.brewfs.io
    volumeHandle: brewfs://replace-with-brewfs-cluster/00000000-0000-0000-0000-000000000001
    volumeAttributes:
      config: /etc/brewfs/config.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace
  namespace: brewfs-csi-smoke
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: brewfs-csi-smoke-workspace
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: workspace-smoke
  namespace: brewfs-csi-smoke
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-ec"]
      args:
        - |
          printf 'csi-smoke:%s\n' "$HOSTNAME" > /workspace/value
          test "$(cat /workspace/value)" = "csi-smoke:$HOSTNAME"
          test -s /workspace/value
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: workspace
