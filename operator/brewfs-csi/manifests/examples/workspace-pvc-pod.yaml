# Replace the PV volumeHandle with an existing operator-provisioned workspace.
# Run only one example per workspace. The PV capacity is administrator-supplied
# binding metadata; the CSI adapter does not allocate or enforce it.
apiVersion: v1
kind: Namespace
metadata:
  name: brewfs-csi-example
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: brewfs-csi-example-workspace
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: brewfs-workspace
    namespace: brewfs-csi-example
  csi:
    driver: csi.brewfs.io
    volumeHandle: brewfs://replace-with-brewfs-cluster/00000000-0000-0000-0000-000000000001
    volumeAttributes:
      config: /etc/brewfs/config.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brewfs-workspace
  namespace: brewfs-csi-example
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: brewfs-csi-example-workspace
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: brewfs-workspace-smoke
  namespace: brewfs-csi-example
spec:
  terminationGracePeriodSeconds: 30
  containers:
    - name: smoke
      image: busybox:1.36
      command:
        - sh
        - -ec
        - |
          printf 'brewfs-csi-smoke\n' > /workspace/probe
          test "$(cat /workspace/probe)" = 'brewfs-csi-smoke'
          sha256sum /workspace/probe
          sleep 3600
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: brewfs-workspace
