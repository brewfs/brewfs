apiVersion: v1
kind: Secret
metadata:
  name: brewfs-csi-config
  namespace: brewfs-csi-system
type: Opaque
stringData:
  # Replace endpoints and credentials before deploying the node DaemonSet.
  # The node plugin reads this file when it starts BrewFS.
  config.yaml: |
    volume_format: workspace
    data:
      backend: s3
      s3:
        bucket: replace-me
        endpoint: https://replace-me
        region: us-east-1
        force_path_style: true
    meta:
      backend: redis
      redis:
        url: redis://replace-me:6379/0
    cache:
      writeback_mode: upload_before_commit
      writeback_persist_sync: true
    fuse:
      privileged: true
