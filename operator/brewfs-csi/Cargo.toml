[package]
name = "brewfs-csi"
version = "0.1.0"
edition = "2024"
description = "Container Storage Interface adapter for BrewFS workspaces"
license = "MIT"

[workspace]

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "process", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
uuid = { version = "1.18", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3.20"
