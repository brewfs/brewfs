<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#175FC8"/>
      <stop offset="1" stop-color="#0E8BEF"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF4FF"/>
    </linearGradient>
  </defs>

  <!-- rounded-square app background -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <!-- subtle top gloss -->
  <path d="M 272 64 H 752 A 208 208 0 0 1 960 272 V 300 A 150 150 0 0 0 810 150 H 214 A 150 150 0 0 0 64 300 V 272 A 208 208 0 0 1 272 64 Z" fill="#FFFFFF" opacity="0.10"/>

  <!-- cloud (three bumps + flat base) -->
  <g fill="url(#cloud)">
    <circle cx="404" cy="452" r="132"/>
    <circle cx="556" cy="412" r="168"/>
    <circle cx="676" cy="466" r="110"/>
    <rect x="352" y="452" width="390" height="150" rx="75"/>
  </g>

  <!-- downward arrow: stem + chevron (cloud -> local mount) -->
  <g stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="512" y1="596" x2="512" y2="742" stroke-width="72"/>
    <path d="M 512 800 L 402 664 M 512 800 L 622 664" stroke-width="72"/>
  </g>
</svg>
