<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#175FC8"/>
      <stop offset="1" stop-color="#0E8BEF"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF4FF"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#bg)"/>

  <!-- cloud-download glyph: white cloud filling the square -->
  <g fill="url(#cloud)">
    <circle cx="396" cy="472" r="158"/>
    <circle cx="566" cy="402" r="198"/>
    <circle cx="716" cy="484" r="140"/>
    <rect x="360" y="472" width="392" height="160" rx="80"/>
  </g>

  <!-- downward arrow cut out of the cloud center (background blue) -->
  <g stroke="#0E8BEF" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="512" y1="430" x2="512" y2="576" stroke-width="88"/>
    <path d="M 512 644 L 424 556 M 512 644 L 600 556" stroke-width="88"/>
  </g>
</svg>
