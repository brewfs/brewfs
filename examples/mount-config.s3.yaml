# S3 object storage + etcd metadata
mount_point: /tmp/brewfs

data:
  backend: s3
  s3:
    bucket: my-bucket
    endpoint: "http://127.0.0.1:9000"
    region: us-east-1
    part_size: 16777216
    max_concurrency: 8
    force_path_style: true
    # Requires Cargo feature rustfs-ec-block-size-hint (disabled in default builds).
    # Optional policy for a compatible Dynamic Block RustFS; disabled when omitted.
    # auto: no hint for final objects <=1 MiB, otherwise request 1 MiB EC blocks.
    # Fixed bytes: 65536, 262144, 1048576, 4194304; independent of layout.block_size.
    # rustfs_ec_block_size_hint: auto

# Optional read-side override, independent of the EC write hint:
# cache:
#   read_fetch_policy: sparse  # backend-default (default), whole-object, or sparse
# Sparse suppresses full-object prefetch for small uncompressed misses.
# Compressed objects and large requests still need whole-object reads.

meta:
  backend: etcd
  etcd:
    urls:
      - "http://127.0.0.1:2379"

layout:
  chunk_size: 67108864
  block_size: 4194304
