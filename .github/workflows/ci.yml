name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**", "perf/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      docker_suite:
        description: Docker/FUSE suite to run
        type: choice
        default: smoke
        options:
          - smoke
          - pjdfstest
          - stress-ng
          - xfstests-smoke
          - ltp
          - tikv-xfstests-smoke
          - tikv-pjdfstest
          - tikv-ltp
          - workspace-overlay
          - all
      stress_ng_profile:
        description: stress-ng profile for the Docker stress job
        type: choice
        default: smoke
        options:
          - smoke
          - metadata-heavy
          - link-symlink-heavy
          - write-smallfile

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check perf scripts
        shell: bash
        run: |
          bash -n docker/compose-xfstests/run_perf_in_container.sh
          bash -n docker/compose-xfstests/run_redis_perf.sh
          bash -n docker/compose-xfstests/run_tikv_xfstests.sh
          bash -n docker/compose-xfstests/run_tikv_ltp.sh
          bash -n docker/compose-xfstests/run_tikv_pjdfstest.sh
          bash -n docker/compose-xfstests/run_tikv_perf.sh
          bash -n docker/compose-xfstests/run_juicefs_perf_in_container.sh
          bash -n docker/compose-xfstests/run_juicefs_perf.sh
          bash -n docker/compose-xfstests/run_workspace_overlay_dual_mount_in_container.sh
          bash -n docker/compose-xfstests/run_workspace_overlay_control_in_container.sh
          bash -n docker/compose-xfstests/run_workspace_overlay_suite_in_container.sh
          bash -n docker/compose-xfstests/run_workspace_overlay_compose.sh
          bash -n docker/compose-xfstests/run_workspace_overlay_suites.sh
          bash -n docker/compose-xfstests/run_s3_git_clone_smoke.sh
          bash docker/compose-xfstests/test_perf_report_delta.sh
          bash docker/compose-xfstests/test_juicefs_direct_matrix.sh
          bash docker/compose-xfstests/test_juicefs_perf_report.sh
          bash docker/compose-xfstests/test_s3_git_clone_smoke_script.sh
          bash docker/compose-xfstests/test_native_perf_budget_parity.sh
          bash docker/compose-xfstests/test_native_perf_memory_guard.sh
          bash tools/perf/test_compare_artifacts.sh
          bash docker/compose-xfstests/test_native_perf_harness_payload.sh

      - name: Build workspace
        run: cargo build --workspace

      - name: Check BrewFS FUSE runtime features
        run: |
          cargo check -p brewfs --no-default-features --features fuse-tokio-runtime
          cargo check -p brewfs --no-default-features --features fuse-io-uring-runtime
          cargo check -p brewfs --no-default-features --features fuse-tokio-runtime,workspace-overlay
          cargo check -p brewfs --no-default-features --features fuse-io-uring-runtime,workspace-overlay

      - name: Test workspace
        run: cargo test --workspace --lib --bins -- --test-threads=1

      - name: Test all features
        run: cargo test --workspace --all-features -- --test-threads=1

      - name: Clippy default features
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy workspace overlay
        run: cargo clippy --workspace --all-targets --features workspace-overlay -- -D warnings

      - name: Test workspace operator
        working-directory: operator/brewfs-operator
        run: |
          cargo check
          cargo test --features workspace-operator
          cargo clippy --features workspace-operator --all-targets -- -D warnings

      - name: Verify generated operator CRDs
        working-directory: operator/brewfs-operator
        run: |
          cargo run --features workspace-operator -- crdgen > /tmp/brewfs-operator-crd.yaml
          diff -u manifests/crd.yaml /tmp/brewfs-operator-crd.yaml

  docker-workspace-overlay-smoke:
    name: Docker workspace overlay smoke (${{ matrix.meta-backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        meta-backend: [redis, tikv]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler fuse3

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -e /dev/fuse
          sudo chmod 666 /dev/fuse

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run workspace overlay control smoke
        run: >-
          bash docker/compose-xfstests/run_workspace_overlay_compose.sh
          --backend "${{ matrix.meta-backend }}"
          --control-only

      - name: Upload workspace overlay smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-overlay-smoke-${{ matrix.meta-backend }}-artifacts
          path: docker/compose-xfstests/artifacts/**
          if-no-files-found: warn
  docker-workspace-overlay:
    name: Docker workspace overlay (${{ matrix.meta-backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (inputs.docker_suite == 'workspace-overlay' || inputs.docker_suite == 'all')
      }}
    strategy:
      fail-fast: false
      matrix:
        meta-backend: [redis, tikv]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler fuse3

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -e /dev/fuse
          sudo chmod 666 /dev/fuse

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run workspace overlay xfstests and LTP Compose suite
        run: >-
          bash docker/compose-xfstests/run_workspace_overlay_compose.sh
          --backend "${{ matrix.meta-backend }}"

      - name: Upload workspace overlay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-overlay-${{ matrix.meta-backend }}-artifacts
          path: docker/compose-xfstests/artifacts/**
          if-no-files-found: warn

  results-web:
    name: Results web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/results/package-lock.json

      - name: Install dependencies
        working-directory: web/results
        run: npm ci

      - name: Test frontend
        working-directory: web/results
        run: npm test -- --run

      - name: Build frontend
        working-directory: web/results
        run: npm run build

      - name: Test result server
        working-directory: web/results
        run: python3 -m unittest -v test_server.py

  docker-pjdfstest:
    name: Docker pjdfstest smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      ${{
        github.event_name != 'workflow_dispatch' ||
        inputs.docker_suite == 'smoke' ||
        inputs.docker_suite == 'pjdfstest' ||
        inputs.docker_suite == 'all'
      }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler fuse3

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -e /dev/fuse
          sudo chmod 666 /dev/fuse

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run pjdfstest
        run: bash docker/compose-xfstests/run_redis_pjdfstest.sh

      - name: Upload pjdfstest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pjdfstest-artifacts
          path: docker/compose-xfstests/artifacts/**
          if-no-files-found: warn

  docker-xfstests-smoke:
    name: Docker xfstests smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (inputs.docker_suite == 'xfstests-smoke' || inputs.docker_suite == 'all')
      }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler fuse3

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -e /dev/fuse
          sudo chmod 666 /dev/fuse

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run xfstests smoke
        run: bash docker/compose-xfstests/run_redis_xfstests.sh --cases "generic/001 generic/002 generic/100"

      - name: Upload xfstests artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfstests-smoke-artifacts
          path: docker/compose-xfstests/artifacts/**
          if-no-files-found: warn

  docker-stress-ng:
    name: Docker stress-ng smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      ${{
        github.event_name != 'workflow_dispatch' ||
        inputs.docker_suite == 'smoke' ||
        inputs.docker_suite == 'stress-ng' ||
        inputs.docker_suite == 'all'
      }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler fuse3

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -e /dev/fuse
          sudo chmod 666 /dev/fuse

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Select stress-ng profile
        shell: bash
        run: |
          profile="${{ inputs.stress_ng_profile }}"
          if [[ -z "$profile" ]]; then
            profile="smoke"
          fi
          echo "STRESS_NG_PROFILE=$profile" >> "$GITHUB_ENV"

      - name: Run stress-ng profile
        run: bash docker/compose-xfstests/run_redis_stress_ng.sh --profile "$STRESS_NG_PROFILE"

      - name: Upload stress-ng artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-ng-artifacts-${{ env.STRESS_NG_PROFILE }}
          path: docker/compose-xfstests/artifacts/**
          if-no-files-found: warn

  docker-ltp:
    name: Docker LTP fs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (inputs.docker_suite == 'ltp' || inputs.docker_suite == 'all')
      }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler fuse3

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -e /dev/fuse
          sudo chmod 666 /dev/fuse

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run LTP fs
        run: bash docker/compose-xfstests/run_redis_ltp.sh

      - name: Upload LTP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltp-fs-artifacts
          path: docker/compose-xfstests/artifacts/**
          if-no-files-found: warn

  docker-tikv-xfstests-smoke:
    name: Docker TiKV xfstests smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (inputs.docker_suite == 'tikv-xfstests-smoke' || inputs.docker_suite == 'all')
      }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler fuse3

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -e /dev/fuse
          sudo chmod 666 /dev/fuse

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run TiKV xfstests smoke
        run: bash docker/compose-xfstests/run_tikv_xfstests.sh --cases "generic/001 generic/002 generic/100"

      - name: Upload TiKV xfstests artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tikv-xfstests-smoke-artifacts
          path: docker/compose-xfstests/artifacts/**
          if-no-files-found: warn

  docker-tikv-pjdfstest:
    name: Docker TiKV pjdfstest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (inputs.docker_suite == 'tikv-pjdfstest' || inputs.docker_suite == 'all')
      }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler fuse3

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -e /dev/fuse
          sudo chmod 666 /dev/fuse

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run TiKV pjdfstest
        run: bash docker/compose-xfstests/run_tikv_pjdfstest.sh

      - name: Upload TiKV pjdfstest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tikv-pjdfstest-artifacts
          path: docker/compose-xfstests/artifacts/**
          if-no-files-found: warn

  docker-tikv-ltp:
    name: Docker TiKV LTP fs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (inputs.docker_suite == 'tikv-ltp' || inputs.docker_suite == 'all')
      }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler fuse3

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -e /dev/fuse
          sudo chmod 666 /dev/fuse

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run TiKV LTP fs
        run: bash docker/compose-xfstests/run_tikv_ltp.sh

      - name: Upload TiKV LTP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tikv-ltp-fs-artifacts
          path: docker/compose-xfstests/artifacts/**
          if-no-files-found: warn
